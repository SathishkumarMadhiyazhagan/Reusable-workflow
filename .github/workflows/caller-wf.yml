name: 'Terraform'

on: 
  push:
    branches: ["main"]
  pull_request:

permissions: 
  repository-projects: write
  actions: write
  checks: write
  contents: write
  deployments: write
  id-token: write


jobs:
  call-workflow-passing-data:
    uses: SathishkumarMadhiyazhagan/github-action-demo/.github/workflows/automate-readme.yml@main

  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{secrets.TF_API_TOKEN}}'
  
      - name: Terraform Init
        run: terraform init
